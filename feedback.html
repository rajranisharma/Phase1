        <header>
            <h1>
                Feedback Form

            <ul>

        <main>
        <h2>Share Your Feedback</h2>
        <p>Please fill in the form below to share your thoughts about the courses
            and the portal.
        </p>
        <form>
            <fieldset>
                <legend>Personal Information</legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"
            placeholder="Enter your  name..">
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
            placeholder="enter your email">
            <br><br>
            <label for="phone">Phone No.</label>
            <input type="tel" id="phone" name="phone"
            placeholder="Enter your Phone No.">
            <br><br></fieldset>
            <fieldset>
            <legend>Gender</legend>

            <input type="radio" id="female"
           name="gender" value="female">

           <label for="female">Female</label>

           <input type="radio" id="female" name="gender" value="Female">

           <label for="male">Male</label>

           <input type="radio" id="male" name="gender" value="Male">

           <label for="other">Other</label>

           <input type="radio" id="other" name="gender" value="Other">

            <br>
            </fieldset>

            <fieldset>
                <legend>Your feedback</legend>
                
            <label for="course">Choose a course:</label>

            <br>
            <select id="course" name="course">
                <option value="html">HTML and Web Fundamentals</option>
                <option value="python">Python</option>
                <option value="dbms">DBMS</option>
            </select>
            <br><br>
            <label for="message">Your Feedback:</label>
            <br>
            <textarea id="message" name="message" rows="5" cols="30"></textarea>
            <br><br>
            <label for="Rate">Rate the portal</label>
            <br>
            <select id="Rate" name="portal">
                <option value="excellent">Excellent</option>
            <option value="very good">Very Good</option>
                <option value="good">Good</option>
            </select>
            <br><br>
           <label for="subscribe">Subscribe to Newsletter and Updates</label>
           <input type="checkbox" id="subscribe" name="like" value="subscribe">
            <br><br>
            <button type="submit">Submit Feedback</button>
            <button type="reset">Reset</button>
            </fieldset>
        </form>
        </main>
        <hr>
